<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Fox Cricket — Live Player</title>
<link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.css">
<style>
html,body{margin:0;width:100%;height:100%;background:#000;overflow:hidden}
#wrap{position:relative;width:100%;height:100%;background:#000}
video{width:100%;height:100%;object-fit:contain;background:#000}
.plyr{width:100%;height:100%;--plyr-color-main:#fff}
.plyr__controls{justify-content:space-between!important}
#status{position:absolute;top:10px;left:10px;color:#fff;background:#0009;padding:6px 9px;
font:13px system-ui;border-radius:5px;z-index:5;display:none}
</style>
</head>
<body>
<div id="wrap">
<video id="video" playsinline autoplay muted></video>
<div id="status">Reconnecting to live stream…</div>
</div>
<script src="https://cdn.jsdelivr.net/npm/hls.js@1.6.15"></script>
<script src="https://cdn.jsdelivr.net/npm/plyr@3.7.8/dist/plyr.polyfilled.js"></script>
<script>
const video=document.getElementById('video'), status=document.getElementById('status');
const source='https://amssandbrix.sandbrix.live/sandbrix/streams/4bFVgGzOjBY8FZ10767771751169.m3u8';
const player=new Plyr(video,{
  autoplay:true, muted:true,
  controls:['play','mute','volume','fullscreen'],
  settings:[], clickToPlay:false, hideControls:true
});
let hls,lastTime=-1,stuckChecks=0,reconnecting=false;
function connect(){
 if(hls){try{hls.destroy()}catch(e){}}
 reconnecting=false; status.style.display='none';
 hls=new Hls({liveSyncDurationCount:3,liveMaxLatencyDurationCount:8,
 maxLiveSyncPlaybackRate:1.5,lowLatencyMode:false,backBufferLength:30,
 maxBufferLength:20,maxMaxBufferLength:30,manifestLoadingTimeOut:20000,
 levelLoadingTimeOut:20000,fragLoadingTimeOut:30000,fragLoadingMaxRetry:6,
 fragLoadingRetryDelay:1000,levelLoadingMaxRetry:6,levelLoadingRetryDelay:1000});
 hls.loadSource(source);hls.attachMedia(video);
 hls.on(Hls.Events.MANIFEST_PARSED,()=>video.play().catch(()=>{}));
 hls.on(Hls.Events.ERROR,(_,data)=>{
  if(!data.fatal)return;status.style.display='block';
  if(data.type===Hls.ErrorTypes.NETWORK_ERROR)hls.startLoad();
  else if(data.type===Hls.ErrorTypes.MEDIA_ERROR)hls.recoverMediaError();
  else setTimeout(connect,2500);
 });
}
video.addEventListener('playing',()=>{status.style.display='none';stuckChecks=0});
video.addEventListener('waiting',()=>{status.textContent='Buffering…';status.style.display='block'});
video.addEventListener('stalled',()=>{status.textContent='Stream stalled — reconnecting…';status.style.display='block'});
setInterval(()=>{
 if(video.paused||video.readyState<2)return;
 if(video.currentTime===lastTime)stuckChecks++;else stuckChecks=0;
 lastTime=video.currentTime;
 if(stuckChecks>=4&&!reconnecting){
  reconnecting=true;status.textContent='Reconnecting…';status.style.display='block';
  try{hls.startLoad(-1);hls.recoverMediaError()}catch(e){}
  video.play().catch(()=>{});stuckChecks=0;setTimeout(()=>reconnecting=false,10000);
 }
},5000);
connect();
</script>
</body>
</html>
